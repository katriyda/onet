name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: .exe, pkg: zip }
          - { goos: windows, goarch: arm64, ext: .exe, pkg: zip }
          - { goos: linux, goarch: amd64, ext: "", pkg: tar.gz }
          - { goos: linux, goarch: arm64, ext: "", pkg: tar.gz }
          - { goos: linux, goarch: arm, goarm: "7", suffix: -armv7, ext: "", pkg: tar.gz }
          - { goos: darwin, goarch: amd64, ext: "", pkg: tar.gz }
          - { goos: darwin, goarch: arm64, ext: "", pkg: tar.gz }
          - { goos: freebsd, goarch: amd64, ext: "", pkg: tar.gz }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        shell: bash
        run: |
          set -euo pipefail
          name="onet-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}"
          mkdir -p "dist/$name" out
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" -o "dist/$name/onet${{ matrix.ext }}" .
          cp README.md "dist/$name/"
          if [ "${{ matrix.pkg }}" = "zip" ]; then
            (cd dist && zip -r "../out/$name.zip" "$name")
          else
            tar -czf "out/$name.tar.gz" -C dist "$name"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: Generate checksums
        working-directory: out
        run: sha256sum onet-* > checksums.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: out/*
          generate_release_notes: true
